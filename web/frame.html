<!doctype html>
<meta charset="utf-8">
<title>lab</title>
<meta name="color-scheme" content="dark">
<style>:root{color-scheme:dark}:root.light{color-scheme:light}html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
<canvas id="c"></canvas>
<script>
// The page asks for /frame?light when it is light: the frame must use the same colour scheme as the page, or the
// browser paints an opaque backing behind it.
if (location.search === '?light') { document.documentElement.className = 'light'; document.querySelector('meta[name=color-scheme]').content = 'light'; }
// Runs one model-written lab. Loaded only inside <iframe sandbox="allow-scripts">: an opaque origin with no access
// to the page, its storage or the network (this page's own policy blocks every connection). The page sends
// {type:"load", sim, params, dark}, then {type:"params"} as sliders move. The frame reports ready or error.
(function () {
  var draw = null, params = {}, dark = false, t0 = performance.now(), running = true, slow = 0, frames = 0;
  var c = document.getElementById('c'), ctx = c.getContext('2d');
  function tell(m) { parent.postMessage(m, '*'); }
  addEventListener('message', function (e) {
    var m = e.data || {};
    if (e.source !== parent) return;
    if (m.type === 'load' && typeof m.sim === 'string') {
      try {
        var made = new Function(m.sim + '\n;return { draw: typeof draw === "function" ? draw : null };')();
        draw = made.draw; params = m.params || {}; dark = !!m.dark; t0 = performance.now();
        tell(draw ? { type: 'ready' } : { type: 'error', error: 'no draw()' });
      } catch (err) { tell({ type: 'error', error: String(err).slice(0, 200) }); }
    } else if (m.type === 'params') { params = m.params || {}; if (m.restart) t0 = performance.now(); }
    else if (m.type === 'run') { running = !!m.on; }
    else if (m.type === 'dark') { dark = !!m.dark; }
  });
  function frame() {
    if (draw && running) {
      var r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
      var w = r.width, h = r.height;
      // Labs may size their drawing on the first frame, so wait until the frame has its real size.
      if (w < 40 || h < 40) { requestAnimationFrame(frame); return; }
      if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
      var s = performance.now();
      try { draw(ctx, { params: params, t: (s - t0) / 1000, w: w, h: h, dark: dark }); }
      catch (err) { draw = null; tell({ type: 'error', error: String(err).slice(0, 200) }); }
      // A lab that paints its own light background on a dark page is shown with its lightness flipped
      // (hues kept), so it sits in the page instead of glaring white.
      if (++frames % 20 === 1) {
        try {
          var px = ctx.getImageData(2, 2, 1, 1).data;
          var light = px[3] > 200 && (0.2126 * px[0] + 0.7152 * px[1] + 0.0722 * px[2]) > 200;
          c.style.filter = dark && light ? 'invert(1) hue-rotate(180deg)' : '';
        } catch (e) {}
      }
      slow = performance.now() - s > 40 ? slow + 1 : 0;
      if (slow > 30) { draw = null; tell({ type: 'error', error: 'drawing too slowly' }); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  tell({ type: 'hello' });
})();
</script>
